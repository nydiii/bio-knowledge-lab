[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-knowledge-lab"
version = "0.1.0"
description = "CPU teaching lab for traceable cross-document biomedical knowledge"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]
semantic = ["torch>=2.5,<3", "transformers>=4.46,<5"]

[project.scripts]
bio-lab = "bio_knowledge_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
